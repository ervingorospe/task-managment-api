name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The Prisma Client is generated into src/generated/prisma (see
      # prisma/schema.prisma's generator block) and gitignored — every
      # later step that imports it (typecheck, lint, test, build) needs
      # this to have run first. Only reads the schema file; no DATABASE_URL
      # or live database required.
      - name: Generate Prisma Client
        run: npx prisma generate

      # Blocking on purpose: fails the job on any high/critical advisory
      # in production dependencies, except the 3 allowlisted in
      # audit-ci.jsonc — all pinned inside every release of `prisma`
      # itself (its unused MySQL driver), with no fix published yet.
      - name: Security scan
        run: npm run security:audit

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint:check

      # Enforces the 70% coverageThreshold in package.json's "jest" block.
      # Deliberately fails right now — real coverage is ~0.5% (only the
      # NestJS-scaffolded boilerplate test exists). Left failing on
      # purpose rather than lowered to pass, so this step honestly
      # reflects that auth/permissions/tickets/orgs aren't tested yet,
      # instead of a green check implying they are.
      - name: Unit tests
        run: npm run test:cov

      - name: Build
        run: npm run build

  # Only runs on a real push to main (not on the PR that merged into it),
  # and only once the ci job above is green.
  deploy-production:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      # This service has Auto-Deploy enabled on Render — it deploys the
      # new commit itself, triggered by its own GitHub integration,
      # independent of this workflow. So this step does NOT trigger a
      # second deploy (that would race the automatic one); it finds the
      # deploy Render already created for this exact commit and polls
      # that one until it reaches a terminal status, failing loudly
      # (with Render's own reason) if it isn't "live". Needs two repo
      # secrets:
      #   RENDER_API_KEY    — Render dashboard -> Account Settings -> API Keys
      #   RENDER_SERVICE_ID — the "srv-..." id in this service's dashboard URL
      - name: Wait for Render's auto-deploy of this commit
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          set -euo pipefail

          commit_sha="${{ github.sha }}"
          deploy_id=""

          # Diagnostic only — RENDER_SERVICE_ID isn't secret-sensitive
          # (it's visible in the dashboard URL to anyone with access to
          # the service already) and printing it bracketed surfaces a
          # bad copy-paste (the whole dashboard URL, a stray space, a
          # trailing newline) immediately instead of a bare 400. Never
          # echoes RENDER_API_KEY.
          echo "DEBUG: RENDER_SERVICE_ID=[$RENDER_SERVICE_ID] (length ${#RENDER_SERVICE_ID})"
          echo "DEBUG: RENDER_API_KEY length=${#RENDER_API_KEY} (never the value itself)"

          # Deliberately no --fail: curl's own exit code on an HTTP error
          # tells us nothing (plain "22"), and --fail discards the
          # response body, which is exactly where Render puts the actual
          # reason. This captures both the status and body ourselves so a
          # failure prints Render's real error message instead of a bare
          # exit code.
          render_api_get() {
            local raw
            raw=$(curl --silent --show-error -w '\n%{http_code}' \
              "https://api.render.com/v1/$1" \
              -H "Authorization: Bearer $RENDER_API_KEY")
            http_status="${raw##*$'\n'}"
            body="${raw%$'\n'*}"
          }

          # Isolates whether the key/auth itself is the problem, before
          # blaming the deploys-list call specifically: this endpoint
          # takes no serviceId at all, so a 400/401 here means the key
          # (or how it's being sent) is wrong, not the service id or the
          # deploys endpoint's own params.
          echo "DEBUG: sanity-checking the API key against GET /v1/services..."
          render_api_get "services?limit=1"
          echo "DEBUG: GET /v1/services -> HTTP $http_status"
          if [ "$http_status" != "200" ]; then
            echo "::error::Render API key check failed (HTTP $http_status): $body"
            exit 1
          fi

          echo "Looking for Render's auto-deploy of commit $commit_sha..."
          # Generous window: the ci job above can itself take a few
          # minutes, by which point Render's own deploy may already be
          # done — that's fine, the first list fetch just finds it
          # already in a terminal state. This is only for the case where
          # it's still mid-flight or hasn't registered yet.
          for i in $(seq 1 20); do
            render_api_get "services/$RENDER_SERVICE_ID/deploys?limit=20"
            if [ "$http_status" != "200" ]; then
              echo "::error::Render API returned HTTP $http_status listing deploys for service [$RENDER_SERVICE_ID]: $body"
              exit 1
            fi

            # Render's list endpoint wraps each entry as {"deploy": {...}, "cursor": "..."}
            # — unwrap defensively in case that ever changes to a flat array.
            deploy_id=$(echo "$body" | jq -r --arg sha "$commit_sha" '
              [.[] | (.deploy // .)] | map(select(.commit.id == $sha)) | .[0].id // empty
            ')

            if [ -n "$deploy_id" ]; then
              echo "Found deploy $deploy_id for commit $commit_sha."
              break
            fi

            echo "[$i/20] Not registered yet, retrying in 10s..."
            sleep 10
          done

          if [ -z "$deploy_id" ]; then
            echo "::error::No Render deploy found for commit $commit_sha after waiting. Confirm Auto-Deploy is on and this service is connected to this repo/branch."
            exit 1
          fi

          echo "Waiting for deploy $deploy_id to finish..."
          # Render builds routinely take a few minutes; poll generously
          # before giving up (40 x 15s = 10 minutes).
          for i in $(seq 1 40); do
            render_api_get "services/$RENDER_SERVICE_ID/deploys/$deploy_id"
            if [ "$http_status" != "200" ]; then
              echo "::error::Render API returned HTTP $http_status fetching deploy $deploy_id: $body"
              exit 1
            fi

            status=$(echo "$body" | jq -r '.status')
            echo "[$i/40] Render deploy status: $status"

            case "$status" in
              live)
                echo "Render deploy succeeded."
                exit 0
                ;;
              build_failed|update_failed|pre_deploy_failed|canceled|deactivated)
                echo "::error::Render deploy $deploy_id failed with status: $status"
                echo "$body" | jq .
                exit 1
                ;;
            esac

            sleep 15
          done

          echo "::error::Timed out waiting for Render deploy $deploy_id to finish (still: $status)."
          exit 1
